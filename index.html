<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Grafitis de Bogotá</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Mapa Interactivo de Grafitis de Bogotá</h1>
            <p class="subtitle">Descubre el arte urbano de la capital colombiana</p>
        </header>
        
        <main class="app-main">
            <div class="filter-panel">
                <label for="localidad-filter">Filtrar por localidad:</label>
                <select id="localidad-filter">
                    <option value="">Todas</option>
                </select>
            </div>
            
            <div id="map" class="map-container"></div>
            
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Cargando grafitis...</p>
            </div>
            
            <div id="error" class="error hidden"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    
    <!-- Application JS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
